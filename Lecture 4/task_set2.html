

<!DOCTYPE html>
<html>
  <head>
    <title>Simple Product Page</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        display: flex;
        background: white;
        color: black;
        transition: 0.3s;
      }

      .menu {
        width: 200px;
        background: #ddd;
        height: 100vh;
        padding: 20px;
      }

      .main {
        flex: 1;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .card {
        background: white;
        border: 1px solid #999;
        padding: 15px;
        border-radius: 5px;
        text-align: center;
        transition: 0.3s;
      }

      .card img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        margin-bottom: 10px;
      }

      button {
        padding: 8px 12px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }

      .dark-mode {
        background: black;
        color: white;
      }

      .dark-mode .menu {
        background: #222;
        color: white;
      }

      .dark-mode .card {
        background: #111;
        border-color: #555;
      }
    </style>
  </head>

      let btn = document.getElementById("themeBtn");

      // Load saved theme
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        btn.innerText = "Switch to Light";
      }

      btn.onclick = function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
